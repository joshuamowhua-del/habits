<!DOCTYPE html>
<html lang="zh-CN" data-font="large">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="好习惯">
<meta name="theme-color" content="#fff8f0">
<title>每日好习惯</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="main"></main>
<nav class="tabbar" aria-label="主菜单">
  <button class="tab" data-action="tab" data-view="today"><span class="ti">🏠</span><span>今天</span></button>
  <button class="tab" data-action="tab" data-view="vocab"><span class="ti">📖</span><span>单词</span></button>
  <button class="tab" data-action="tab" data-view="travel"><span class="ti">🧳</span><span>旅行</span></button>
  <button class="tab" data-action="tab" data-view="health"><span class="ti">🩺</span><span>养生</span></button>
  <button class="tab" data-action="tab" data-view="trends"><span class="ti">📈</span><span>趋势</span></button>
  <button class="tab" data-action="tab" data-view="settings"><span class="ti">⚙️</span><span>设置</span></button>
</nav>
<div id="player" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="cheer" aria-live="polite"></div>
<div id="modal-root"></div>
<div id="fc-root"></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<script src="news.js"></script>
<script src="news-audio.js"></script>
<script src="health.js"></script>
<script src="words.js"></script>
<script src="travel.js"></script>
<script src="travel-prices.js"></script>
<script src="app.js"></script>
</body>
</html>
