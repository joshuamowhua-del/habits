# Checks real flight prices for the top travel picks every morning (US Pacific ~6:30am).
name: daily-flights
on:
  schedule:
    - cron: '30 13 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  flights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: TZ=Asia/Shanghai python3 scripts/update_flights.py
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      - run: |
          git config user.name "flights-bot"
          git config user.email "flights-bot@users.noreply.github.com"
          git add travel-prices.js
          git diff --cached --quiet || git commit -m "daily flight prices $(date +%F)"
          git pull --rebase -q && git push
