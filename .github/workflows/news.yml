# Refreshes news.js every morning (US Pacific ~6am) once the site is on GitHub Pages.
name: daily-news
on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: TZ=America/Los_Angeles python3 scripts/update_news.py
      - run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.js
          git diff --cached --quiet || git commit -m "daily news $(date +%F)"
          git pull --rebase -q && git push
