# Refreshes news.js twice a day (about 6:00 and 18:00 Beijing time); the pages job then re-records the audio.
name: daily-news
on:
  schedule:
    - cron: '0 22 * * *'
    - cron: '0 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: TZ=Asia/Shanghai python3 scripts/update_news.py
      - run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.js
          git diff --cached --quiet || git commit -m "daily news $(TZ=Asia/Shanghai date '+%F %H:%M')"
          git pull --rebase -q && git push
